name: Subway Korea ingredient menu review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/menu-ingredients-daily.yml'
  schedule:
    # Every day at 09:17 JST/KST (GitHub cron is UTC).
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: subway-ingredient-review
  cancel-in-progress: false

jobs:
  check-ingredients:
    if: github.repository == 'thanksstevenkim/subway-random-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify fail-closed parser tests
        run: python3 -m unittest discover -s tests -v

      - name: Read official ingredient list and compare
        run: python3 scripts/check_ingredients.py

      - name: Open/update a review PR when needed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/ingredient-menu-review
          delete-branch: true
          add-paths: |
            data/menu.json
            reports/menu-ingredient-review.md
          commit-message: 'chore: propose official Subway ingredient review'
          title: '🥪 써브웨이 공식 재료 변경 검토 (자동 감지)'
          body: |
            한국 써브웨이 공식 재료소개 페이지에서 감지한 변경 **검토용 PR**입니다.

            - 보고서: reports/menu-ingredient-review.md
            - data/menu.json의 추가·삭제는 제안이며 병합 전에 메뉴 상태 확인이 필요합니다.
            - 수집 실패, 파싱 오류, 대규모 변화는 안전을 위해 변경하지 않습니다.
            - 샌드위치·사이드·음료는 아직 이 스캐너에 포함되지 않습니다.
            - 자동 병합·서버 배포는 수행하지 않습니다.
